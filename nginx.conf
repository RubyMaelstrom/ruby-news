# ruby.news — nginx config (lua-nginx-module)
# Deploy to your nginx server and reload: nginx -s reload
#
# Prerequisites:
#   - nginx compiled with --with-http_lua_module (or nginx-extras package)
#   - lua-resty-http installed in the Lua package path
#   - lua-resty-core installed (usually bundled with lua-nginx-module)

 # Adjust this path to match your deployment structure.
# All Lua files are in a flat directory — no subdirectories, just module names.

# IN THE HTTP CONTEXT (outside server block), add:
#   lua_shared_dict news_cache 10m;
#   lua_shared_dict article_cache 20m;
#   lua_package_path '/etc/nginx/lua/?.lua;;';

# Then include this file from your server block or paste its contents.

server {
    listen 80;
    server_name news.rubymaelstrom.com;

    # DNS resolver for Lua cosockets
    resolver 8.8.8.8 8.8.4.4 ipv6=off;
    resolver_timeout 5s;

    # --- Shared memory zones (put these in the http context, or keep here if using nginx >= 1.23)
    lua_shared_dict news_cache 10m;
    lua_shared_dict article_cache 20m;

    # --- Lua package path (all files are flat in this directory)
    lua_package_path '/etc/nginx/lua/?.lua;;';

    # --- Pre-load modules at startup
    init_by_lua_block {
        -- Nothing to pre-load; all modules are loaded per-request
    }

    # --- Main news feed page
    location /news {
        content_by_lua_file /etc/nginx/lua/handlers/index.lua;
    }

    # --- Article detail page
    location /news/article {
        content_by_lua_file /etc/nginx/lua/handlers/article.lua;
    }

    # --- Country edition selector
    location /news/choose_edition {
        content_by_lua_file /etc/nginx/lua/handlers/choose_edition.lua;
    }

    # --- Error pages (fallback)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
